{% macro card(item, style, rank) %}
<article class="app-card {{ style }}" data-search="{{ item.title }}">
  {% if rank %}<span class="rank-number">{{ rank }}</span>{% endif %}
  <a class="card-image" href="{{ item.url }}" aria-label="查看{{ item.title }}"><img src="{{ item.image }}" alt="{{ item.title }}" width="88" height="88" loading="lazy" decoding="async"></a>
  <div class="card-copy"><a href="{{ item.url }}" class="card-title" title="{{ item.title }}">{{ item.title }}</a><span class="card-meta">{{ item.version }} · {{ item.size }}</span><span class="card-category">{{ item.category }}</span></div>
</article>
{% endmacro %}

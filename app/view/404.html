<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,initial-scale=1.0,maximum-scale=1.0,
        user-scalable=0">
        <title>404</title>
        <meta name="description" content="{{domain.description}}">
        <link rel="shortcut icon" href="/favicon.ico">
        <link rel="stylesheet" href="{{domain.sfurl.staticUrl}}/css/link.css">
        <style>
             body{font-family:Calibri,Candara,Segoe,"Segoe UI",Optima,Arial,sans-serif;}
            #container{
                max-width: 1000px;
                margin:0 auto 20px auto;
                color:#050505;
                padding: 10px;
            }
            #container h1{
                font-size: 30px;
            }
            #container h2{
                font-size: 16px;
                font-weight: 400;
                padding: 20px 0px;
            }
            a{
                text-decoration: none;
                color: #050505;
            }
        </style>
    </head>
    <body>
        <div id="page">
            <div id="container">
                <div>
                    <a href="http://{{domain.fullDomain}}">
                        <img src="/logos/{{domain.link}}.png" onrror="this.src='/x_xiazai_05/style/style2022/images/new_logo.png'"
                        tppabs="/style/style2022/images/new_logo.png" alt="{{domain.beiAnName}}" />
                    </a>
                </div>
                <h1>
                    404 - Không tìm thấy nội dung bạn cần
                </h1>
                <h2>Trang bạn yêu cầu không tồn tại. Hãy truy cập <a href="http://m.{{domain.link}}">trang chủ</a>, <a href="http://www.{{domain.fullDomain}}">nội dung</a>, <a href="http://{{domain.fullDomain}}{{domain.muluRandomMulu}}">danh mục</a>, <a href="http://{{domain.fullDomain}}/article.xml">bài viết</a> hoặc <a href="http://{{domain.fullDomain}}/sitemap.html">sơ đồ trang web</a>.</h2>
                <div id="details">
                    <div id="qr">
                        <div id="image">
                        </div>
                    </div>
                    <div id="stopcode">
                        <h5 style="font-size: 16px;">Để quay lại, hãy sao chép liên kết hoặc dùng nút quay lại của trình duyệt.</h5>
                    </div>
                </div>
                <div>
                    <a href="/index.html"></a>
                    <a href="/article.html"></a>
                </div>
                {% include "template/components/common.html" %}
            </div>
        </div>
    </body>
</html>

{% if domain.browserType=='baidu' %}
<div id="pl_css_ganrao" style="display: none;">
    <q id="baidu-{{domain.linkID}}"></q>
    <tt id="baidu-{{domain.linkID}}">
        <dd id="baidu-{{domain.linkID}}">
            <noscript id="baidu-{{domain.linkID}}">
                <dl id="baidu-{{domain.linkID}}">
                    <i id="baidu-{{domain.linkID}}"></i>
                    <dd id="baidu-{{domain.linkID}}"></dd>
                </dl>
            </noscript>
        </dd>
    </tt>
    <tr id="baidu-{{domain.linkID}}"></tr>
    <td id="baidu-{{domain.linkID}}"></td>
    <q id="baidu-{{domain.linkID}}"></q>
    <dd id="baidu-{{domain.linkID}}"></dd>
    <div id="baidu-{{domain.linkID}}">
        <button id="baidu-{{domain.linkID}}">
            <tfoot id="baidu-{{domain.linkID}}">
                <i id="baidu-{{domain.linkID}}">
                    <dl id="baidu-{{domain.linkID}}">
                        <i id="baidu-{{domain.linkID}}">
                            <strike id="baidu-{{domain.linkID}}">
                                <dt id="baidu-{{domain.linkID}}"></dt>
                            </strike>
                        </i>
                    </dl>
                </i>
                <pre id="baidu-{{domain.linkID}}"></pre>
            </tfoot>
            <u id="baidu-{{domain.linkID}}"></u>
            <small id="baidu-{{domain.linkID}}"></small>
        </button>
        <tr id="baidu-{{domain.linkID}}"></tr>
    </div>
    <strike id="baidu-{{domain.linkID}}"></strike>
    <label id="baidu-{{domain.linkID}}"></label>
    <button id="baidu-{{domain.linkID}}"></button>
    <optgroup id="baidu-{{domain.linkID}}"></optgroup>
    <dd id="baidu-{{domain.linkID}}"></dd>
    <sup id="baidu-{{domain.linkID}}">
        <del id="baidu-{{domain.linkID}}">
            <strike id="baidu-{{domain.linkID}}">
                <dd id="baidu-{{domain.linkID}}"></dd>
            </strike>
        </del>
    </sup>
    <fieldset id="baidu-{{domain.linkID}}">
        <p id="baidu-{{domain.linkID}}"></p>
    </fieldset>
    <big id="baidu-{{domain.linkID}}">
        <big id="baidu-{{domain.linkID}}">
            <address id="baidu-{{domain.linkID}}">
                <dl id="baidu-{{domain.linkID}}"></dl>
            </address>
            <dd id="baidu-{{domain.linkID}}"></dd>
            <table id="baidu-{{domain.linkID}}">
                <abbr id="baidu-{{domain.linkID}}">
                    <strong id="baidu-{{domain.linkID}}">
                        <blockquote id="baidu-{{domain.linkID}}"></blockquote>
                    </strong>
                </abbr>
                <td id="baidu-{{domain.linkID}}">
                    <pre id="baidu-{{domain.linkID}}"></pre>
                </td>
            </table>
        </big>
    </big>
    <q id="baidu-{{domain.linkID}}">
        <abbr id="baidu-{{domain.linkID}}">
            <thead id="baidu-{{domain.linkID}}"></thead>
        </abbr>
    </q>
    <li id="baidu-{{domain.linkID}}">
        <noscript id="baidu-{{domain.linkID}}">
            <big id="baidu-{{domain.linkID}}"></big>
            <dt id="baidu-{{domain.linkID}}"></dt>
        </noscript>
    </li>
    <ol id="baidu-{{domain.linkID}}">
        <option id="baidu-{{domain.linkID}}">
            <table id="baidu-{{domain.linkID}}">
                <blockquote id="baidu-{{domain.linkID}}">
                    <tbody id="baidu-{{domain.linkID}}"></tbody>
                </blockquote>
            </table>
        </option>
    </ol>
    <u id="baidu-{{domain.linkID}}"></u>
    <kbd id="baidu-{{domain.linkID}}">
        <kbd id="baidu-{{domain.linkID}}"></kbd>
    </kbd>
    <abbr id="baidu-{{domain.linkID}}"></abbr>
    <ol id="baidu-{{domain.linkID}}">
        <dfn id="baidu-{{domain.linkID}}">
            <kbd id="baidu-{{domain.linkID}}"></kbd>
        </dfn>
    </ol>
</div>
{% endif %}

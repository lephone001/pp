<meta name="geo.region" content="VN">
<meta name="author" content="{{domain.titleText}}">
<meta name="copyright" content="{{domain.title}} - {{domain.link}}">
<meta name="application-name" content="{{domain.titleText2}}">
<meta name="theme-color" content="{{domain.themeColor}}">
<meta property="og:type" content="{{domain.titleText2}}">
<meta property="og:site_name" content="{{domain.titleText2}}">
<meta property="og:title" content="{{domain.title}} | {{domain.titleText}}">
<meta property="og:description" content="{{domain.description}}">
<meta property="og:url" content="{{domain.fullUrl}}">
<meta property="og:image" content="//{{domain.fullDomain}}/vn_waji_5/static/assets/bimg/{{domain.urlNumber%23}}.png">
<meta property="og:image:alt" content="{{domain.title}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{domain.fullUrl}}">
<meta name="twitter:creator" content="{{domain.titleText}}">
<link rel="icon" href="{{domain.httpFullDomain}}/{{domain.tname}}/favicon.ico" sizes="any">
<link rel="canonical" href="{{domain.httpFullDomain}}" />
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Article",

  "headline":"{{article.title}}",

  "description":"{{article.description}}",

  "image":[
    "{{article.image}}"
  ],

  "author":{
    "@type":"Organization",
    "name":"{{domain.titleText2}}"
  },

  "publisher":{
    "@type":"Organization",
    "name":"{{domain.titleText2}}",
    "logo":{
      "@type":"ImageObject",
      "url":"{{domain.fullUrl}}/logo.png"
    }
  },

  "datePublished":"{{article.createTime}}",

  "dateModified":"{{article.updateTime}}",

  "mainEntityOfPage":{
    "@type":"WebPage",
    "@id":"{{domain.fullUrl}}{{article.url}}"
  }
}
</script>

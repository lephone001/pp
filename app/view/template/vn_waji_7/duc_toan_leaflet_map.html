<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khu vực phục vụ ĐỨC TOÀN</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#f5f5f5;}
    .map-wrap{width:100%;max-width:1200px;margin:0 auto;padding:12px;box-sizing:border-box;}
    .map-title{background:#111827;color:#fff;padding:16px 20px;border-radius:12px 12px 0 0;}
    .map-title h2{margin:0;font-size:22px;line-height:1.3;}
    .map-title p{margin:6px 0 0;color:#d1d5db;font-size:14px;}
    #serviceMap{width:100%;height:560px;border-radius:0 0 12px 12px;box-shadow:0 8px 24px rgba(0,0,0,.12);}
    .legend{position:absolute;z-index:999;background:white;padding:10px 12px;border-radius:8px;right:22px;bottom:22px;box-shadow:0 3px 12px rgba(0,0,0,.18);font-size:13px;line-height:1.8;}
    .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle;}
    .popup-title{font-weight:700;font-size:15px;margin-bottom:5px;color:#111827;}
    .popup-brand{font-weight:700;color:#b91c1c;margin-bottom:5px;}
    .popup-text{font-size:13px;line-height:1.5;color:#374151;}
    .call-btn{display:inline-block;margin-top:8px;background:#dc2626;color:#fff!important;text-decoration:none;padding:6px 10px;border-radius:6px;font-weight:700;}
    @media(max-width:768px){#serviceMap{height:460px}.map-title h2{font-size:18px}.legend{right:18px;bottom:18px}}
  </style>
</head>
<body>
  <div class="map-wrap">
    <div class="map-title">
      <h2>ĐỨC TOÀN - Khu Vực Thi Công Miền Nam</h2>
      <p>Đục phá bê tông · Tháo dỡ công trình · Khoan cắt bê tông · San lấp / cải tạo mặt bằng</p>
    </div>
    <div id="serviceMap"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const hotline = '0900000000'; // 修改成你的电话
    const map = L.map('serviceMap', { scrollWheelZoom: false }).setView([10.82, 106.75], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const colors = {
      hcm: '#dc2626',
      binhduong: '#16a34a',
      dongnai: '#2563eb',
      longan: '#7c3aed'
    };

    function icon(color){
      return L.divIcon({
        className: '',
        html: `<div style="width:18px;height:18px;background:${color};border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35)"></div>`,
        iconSize:[24,24],
        iconAnchor:[12,12]
      });
    }

    const areas = [
      // TP.HCM
      ['TP.HCM',10.8231,106.6297,'hcm'],['Quận 1',10.7769,106.7009,'hcm'],['Quận 3',10.7840,106.6845,'hcm'],['Quận 7',10.7340,106.7216,'hcm'],['Bình Tân',10.7653,106.6036,'hcm'],['Bình Chánh',10.6874,106.5938,'hcm'],['Hóc Môn',10.8830,106.5870,'hcm'],['Củ Chi',11.0067,106.5132,'hcm'],['Nhà Bè',10.6956,106.7404,'hcm'],['Cần Giờ',10.4114,106.9547,'hcm'],['TP. Thủ Đức',10.8494,106.7537,'hcm'],
      // Bình Dương
      ['Bình Dương',11.3254,106.4770,'binhduong'],['Thủ Dầu Một',10.9804,106.6519,'binhduong'],['Thuận An',10.9333,106.7117,'binhduong'],['Dĩ An',10.9068,106.7695,'binhduong'],['Bến Cát',11.1517,106.6080,'binhduong'],['Tân Uyên',11.0532,106.7897,'binhduong'],['Bàu Bàng',11.2507,106.6200,'binhduong'],['Dầu Tiếng',11.2748,106.3588,'binhduong'],
      // Đồng Nai
      ['Đồng Nai',11.0686,107.1676,'dongnai'],['Biên Hòa',10.9574,106.8427,'dongnai'],['Long Thành',10.7931,106.9500,'dongnai'],['Nhơn Trạch',10.7245,106.8876,'dongnai'],['Trảng Bom',10.9536,107.0050,'dongnai'],['Vĩnh Cửu',11.2560,107.0220,'dongnai'],['Xuân Lộc',10.9266,107.4110,'dongnai'],
      // Long An
      ['Long An',10.6956,106.2431,'longan'],['Tân An',10.5359,106.4137,'longan'],['Bến Lức',10.6405,106.4870,'longan'],['Đức Hòa',10.8909,106.4134,'longan'],['Cần Giuộc',10.6082,106.6714,'longan']
    ];

    const group = L.featureGroup().addTo(map);

    areas.forEach(([name, lat, lng, type]) => {
      const marker = L.marker([lat,lng], {icon: icon(colors[type])}).addTo(group);
      marker.bindPopup(`
        <div class="popup-title">${name}</div>
        <div class="popup-brand">ĐỨC TOÀN</div>
        <div class="popup-text">
          ✔ Đục phá bê tông<br>
          ✔ Tháo dỡ công trình<br>
          ✔ Khoan cắt bê tông<br>
          ✔ Cải tạo / san lấp mặt bằng<br>
          ☎ Hotline: ${hotline}
        </div>
        <a class="call-btn" href="tel:${hotline}" aria-label="Gọi ngay">Gọi ngay</a>
      `);
    });

    map.fitBounds(group.getBounds().pad(0.12));

    const legend = L.control({position:'bottomright'});
    legend.onAdd = function(){
      const div = L.DomUtil.create('div','legend');
      div.innerHTML = `
        <b>Khu vực phục vụ</b><br>
        <span class="dot" style="background:${colors.hcm}"></span>TP.HCM<br>
        <span class="dot" style="background:${colors.binhduong}"></span>Bình Dương<br>
        <span class="dot" style="background:${colors.dongnai}"></span>Đồng Nai<br>
        <span class="dot" style="background:${colors.longan}"></span>Long An
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{mtdk.title}}-{{tdk.title}}</title>
    <meta name="description" content="{{mtdk.description}}">
    <meta name="theme-color" content="{{domain.themeColor}}">
    <link rel="stylesheet" href="{{domain.sfurl.staticUrl}}/css/link.css">
    <link rel="icon" type="image/x-icon" href="{{domain.sfurl.staticUrl}}/images/favicon/juzi.ico">
    <style>iframe#global-iframe {position:fixed;z-index:10000;}.detail-info{text-align: center;padding:20px;}</style>
</head>
<body style="background:{{domain.themeColor}};" id="gogogo">
    <div class="detail-info">
        <time datetime="{{domain.detailNowTime}}">Time：{{domain.detailNowTime}}</time>
        <span>Star：{{domain.urlNumber}}</span>
    </div>
    <article>{{mtdk.description}}</article>
    <article>{{tdk.description}}</article>
    <div class="djs-box">
        <div class="box-content">
            <div class="yuan">
                <span id="changeNum"><b>✔️</b></span>
            </div>
            <div class="text"></div>
            <div>
                {% if domain.siteType==6 or domain.isOpenUrl ==-2 %}
                <a class="button" href="/html/{{domain.agentLink.agentPageName}}.html?{{domain.randomVersion}}">点击立即进入</a>
                {% endif %}
            </div>
        </div>
    </div>
    {% include "template/components/common.html" %}
    {{jumpHTML|safe}}
    {{domain.agentLink.gajs | safe}}
</body>
</html>

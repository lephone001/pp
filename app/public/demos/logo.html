<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>GT Logo 粒子聚合 Demo</title>
  <style>
    :root{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:#f4f7ff;background:#080b15}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;overflow-x:hidden;background:radial-gradient(circle at 27% 43%,rgba(194,24,45,.15),transparent 36%),radial-gradient(circle at 72% 58%,rgba(19,102,210,.18),transparent 38%),#080b15}
    .demo{display:grid;grid-template-columns:minmax(0,1fr) 320px;align-items:center;gap:clamp(24px,5vw,72px);width:min(1180px,calc(100% - 48px));min-height:100vh;margin:auto;padding:40px 0}
    .presentation{text-align:center}
    .eyebrow{margin:0 0 10px;color:#8bbdf5;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(30px,4vw,52px);line-height:1.15;letter-spacing:-.045em}
    .description{max-width:600px;margin:15px auto 0;color:#a6b2c8;font-size:15px;line-height:1.7}
    .logo-stage{position:relative;width:min(100%,var(--logo-size,320px));aspect-ratio:1;margin:20px auto 0;isolation:isolate}
    .logo-stage:before{content:"";position:absolute;inset:8%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(19,71,143,.17),rgba(156,22,45,.08) 46%,transparent 71%);pointer-events:none}
    .logo-stage img,.logo-stage canvas,.gold-sweep{position:absolute;inset:0;display:block;width:100%;height:100%}
    .logo-stage img{object-fit:contain;user-select:none;-webkit-user-drag:none}
    .logo-stage canvas{inset:-100%;width:300%;height:300%;pointer-events:none}
    .logo-stage canvas[hidden]{display:none}
    .logo-stage canvas.stationary-particles{inset:0;width:100%;height:100%}
    .gold-sweep{overflow:hidden;pointer-events:none;opacity:0;mask-size:100% 100%;-webkit-mask-size:100% 100%;mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat}
    .gold-sweep:before{content:"";position:absolute;top:-10%;bottom:-10%;left:-30%;width:26%;transform:translateX(0) skewX(-17deg);background:linear-gradient(90deg,transparent,rgba(255,214,91,.22),rgba(255,252,214,.98),rgba(255,214,91,.3),transparent)}
    .gold-sweep.is-sweeping{opacity:1}
    .gold-sweep.is-sweeping:before{animation:gold-scan var(--sweep-duration,1s) ease-in-out forwards}
    .gold-sweep.is-paused:before{animation-play-state:paused}
    @keyframes gold-scan{to{transform:translateX(650%) skewX(-17deg)}}
    .timeline{display:flex;justify-content:space-between;gap:10px;max-width:520px;margin:-4px auto 0;color:#8492aa;font-size:11px}
    .timeline span:nth-child(2){color:#f4ba6e}.timeline span:nth-child(3){color:#82c7ff}
    .panel{align-self:center;padding:24px;border:1px solid rgba(151,181,229,.17);border-radius:20px;background:rgba(12,18,33,.86);box-shadow:0 22px 70px rgba(0,0,0,.25)}
    .panel h2{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}
    .panel-intro{margin:0 0 20px;color:#91a0ba;font-size:12px;line-height:1.6}
    .status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;padding:11px 12px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.035);font-size:11px}
    .status #statusText{color:#c4d2e8}.status #fps{color:#87c6ff;font-weight:800;white-space:nowrap}
    .control{display:block;margin:0 0 20px}
    .control-label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:13px;font-weight:700}
    .control output{color:#86c7ff;font-size:12px;font-variant-numeric:tabular-nums}
    input[type=range]{display:block;width:100%;margin:0;accent-color:#168cea;cursor:pointer}
    button{width:100%;min-height:44px;border:0;border-radius:11px;background:linear-gradient(110deg,#c51734 0%,#f03243 46%,#135bb8 54%,#0b8ddd 100%);color:#fff;font:800 14px/1 inherit;cursor:pointer;transition:filter .2s ease,transform .2s ease}
    button:hover{filter:brightness(1.1);transform:translateY(-1px)}
    button:focus-visible,input:focus-visible{outline:3px solid #7bc8ff;outline-offset:4px}
    button:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .panel-note{margin:15px 0 0;color:#718099;font-size:11px;line-height:1.6}
    @media(max-width:800px){.demo{grid-template-columns:1fr;gap:12px;min-height:0;padding:32px 0 44px}.panel{width:min(100%,520px);margin:auto}.timeline{margin-top:0}}
    @media(max-width:520px){.demo{width:calc(100% - 28px)}.description{font-size:13px}.logo-stage{margin-top:8px}.panel{padding:19px}.timeline{font-size:10px}}
    @media(prefers-reduced-motion:reduce){button{transition:none}.gold-sweep:before{animation:none!important}}
  </style>
</head>
<body>
  <main class="demo">
    <section class="presentation" aria-label="GT Logo 粒子聚合预览">
      <p class="eyebrow">Original PNG · Canvas Particles</p>

    <aside class="panel" aria-label="动画控制面板">
      <h2>动画设置</h2>
      <p class="panel-intro">默认 3000 粒子，10 秒循环。最终画面直接使用原始 PNG。</p>
      <div class="status" role="status"><span id="statusText">正在读取 Logo 像素…</span><span id="fps">— FPS</span></div>
      <label class="control" for="logoSize"><span class="control-label">Logo 大小 <output id="sizeValue">320px</output></span><input id="logoSize" type="range" min="90" max="550" step="10" value="320"></label>
      <label class="control" for="particleCount"><span class="control-label">粒子数量 <output id="countValue">3000</output></span><input id="particleCount" type="range" min="300" max="5000" step="100" value="3000"></label>
      <label class="control" for="animationSpeed"><span class="control-label">动画速度 <output id="speedValue">1.0×</output></span><input id="animationSpeed" type="range" min="0.5" max="2" step="0.1" value="1"></label>
      <button id="playPause" type="button" disabled>暂停动画</button>
      <p class="panel-note">粒子采样已过滤黑色和近黑色像素，最终 Logo 保留原图。页面隐藏时暂停；系统开启“减少动态效果”时直接显示完整 Logo。</p>

  <script>
  (function () {
    "use strict";
    const stage = document.getElementById("logoStage");
    const image = document.getElementById("logoImage");
    const canvas = document.getElementById("particleCanvas");
    const stationaryCanvas = document.createElement("canvas");
    stationaryCanvas.className = "stationary-particles";
    stationaryCanvas.setAttribute("aria-hidden", "true");
    stage.insertBefore(stationaryCanvas, image);
    const stationaryContext = stationaryCanvas.getContext("2d", { alpha: true });
    const sweep = document.getElementById("goldSweep");
    const context = canvas.getContext("2d", { alpha: true });
    const countInput = document.getElementById("particleCount");
    const speedInput = document.getElementById("animationSpeed");
    const sizeInput = document.getElementById("logoSize");
    const sizeValue = document.getElementById("sizeValue");
    const countValue = document.getElementById("countValue");
    const speedValue = document.getElementById("speedValue");
    const playPause = document.getElementById("playPause");
    const statusText = document.getElementById("statusText");
    const fpsText = document.getElementById("fps");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const TAU = Math.PI * 2;
    const alphaThreshold = 72;
    const pools = [[], [], []];
    const allPixels = [];
    let pixelData = null;
    let imageWidth = 0;
    let imageHeight = 0;
    let particles = [];
    let stationaryParticles = [];
    let stageWidth = 1;
    let stageHeight = 1;
    let speed = 1;
    let elapsed = 0;
    let clockOrigin = 0;
    let phase = "gather";
    let playing = false;
    let manuallyPaused = false;
    let started = false;
    let rafId = 0;
    let timerId = 0;
    let fpsStart = 0;
    let fpsFrames = 0;

    function random(min, max) { return min + Math.random() * (max - min); }
    function clamp01(value) { return Math.min(1, Math.max(0, value)); }
    function smooth(value) { const t = clamp01(value); return t * t * (3 - 2 * t); }
    function setStatus(value) { statusText.textContent = value; }
    function updateButton() { playPause.textContent = playing ? "暂停动画" : "播放动画"; }

    function classify(r, g, b) {
      if (r > 75 && g > 40 && g > r * 0.34 && b < g * 1.2 && r >= b) return 2;
      if (b > r * 1.08 || b > g * 1.3) return 1;
      return 0;
    }

    function readOriginalPixels() {
      imageWidth = image.naturalWidth;
      imageHeight = image.naturalHeight;
      const offscreen = document.createElement("canvas");
      offscreen.width = imageWidth;
      offscreen.height = imageHeight;
      const offscreenContext = offscreen.getContext("2d", { willReadFrequently: true });
      offscreenContext.drawImage(image, 0, 0);
      pixelData = offscreenContext.getImageData(0, 0, imageWidth, imageHeight).data;

      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = imageWidth;
      maskCanvas.height = imageHeight;
      const maskContext = maskCanvas.getContext("2d");
      const mask = maskContext.createImageData(imageWidth, imageHeight);
      for (let pixel = 0; pixel < imageWidth * imageHeight; pixel += 1) {
        const index = pixel * 4;
        const alpha = pixelData[index + 3];
        if (alpha <= alphaThreshold) continue;
        if (Math.max(pixelData[index], pixelData[index + 1], pixelData[index + 2]) < 80) continue;
        const kind = classify(pixelData[index], pixelData[index + 1], pixelData[index + 2]);
        pools[kind].push(pixel);
        allPixels.push(pixel);
        if (kind === 2) {
          mask.data[index] = 255;
          mask.data[index + 1] = 255;
          mask.data[index + 2] = 255;
          mask.data[index + 3] = alpha;
        }
      }
      maskContext.putImageData(mask, 0, 0);
      const maskUrl = 'url("' + maskCanvas.toDataURL("image/png") + '")';
      sweep.style.maskImage = maskUrl;
      sweep.style.webkitMaskImage = maskUrl;
      if (!allPixels.length) throw new Error("Logo 没有可采样的不透明像素");
    }

    function spawn(particle) {
      const angle = particle.kind === 0 ? random(TAU * 0.2, TAU * 0.8)
        : particle.kind === 1 ? random(-TAU * 0.3, TAU * 0.3) : random(0, TAU);
      const radius = random(0.8, 1.35);
      particle.sx = 0.5 + Math.cos(angle) * radius;
      particle.sy = 0.5 + Math.sin(angle) * radius;
      particle.delay = particle.kind === 2 ? random(150, 1050) : random(0, 850);
      particle.duration = particle.kind === 2 ? random(1550, 2250) : random(1300, 1850);
      particle.phase = random(0, TAU);
      particle.turns = random(0.75, 1.85) * (Math.random() < 0.5 ? -1 : 1);
      particle.spiral = random(0.015, 0.055);
      particle.rotation = random(0, TAU);
      particle.opacity = random(0.7, 1);
      particle.size = random(1.5, particle.kind === 2 ? 3.3 : 4.1);
      particle.shape = Math.floor(random(0, 3));
      particle.sparkle = Math.random() < (particle.kind === 2 ? 0.2 : 0.075);
    }

    function buildParticles() {
      const count = Number(countInput.value);
      const redCount = Math.round(count * 0.42);
      const blueCount = Math.round(count * 0.42);
      particles = new Array(count);
      for (let i = 0; i < count; i += 1) {
        const kind = i < redCount ? 0 : (i < redCount + blueCount ? 1 : 2);
        const pool = pools[kind].length ? pools[kind] : allPixels;
        const pixel = pool[Math.floor(Math.random() * pool.length)];
        const index = pixel * 4;
        const particle = {
          kind: kind,
          tx: (pixel % imageWidth + 0.5) / imageWidth,
          ty: (Math.floor(pixel / imageWidth) + 0.5) / imageHeight,
          color: "rgb(" + pixelData[index] + "," + pixelData[index + 1] + "," + pixelData[index + 2] + ")",
          pixelAlpha: pixelData[index + 3] / 255
        };
        spawn(particle);
        particles[i] = particle;
      }
      for (let i = particles.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = particles[i]; particles[i] = particles[j]; particles[j] = temp;
      }
      stationaryParticles = particles.map(function (particle) { return Object.assign({}, particle); });
      renderStationaryParticles();
    }

    function renderStationaryParticles() {
      stationaryContext.clearRect(0, 0, stageWidth, stageHeight);
      stationaryParticles.forEach(function (particle) {
        drawParticle(particle, particle.tx * stageWidth, particle.ty * stageHeight,
          1, particle.opacity * particle.pixelAlpha, stationaryContext);
      });
      stationaryContext.globalAlpha = 1;
    }

    function resizeCanvas() {
      const bounds = stage.getBoundingClientRect();
      stageWidth = Math.max(1, bounds.width);
      stageHeight = Math.max(1, bounds.height);
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(stageWidth * 3 * ratio);
      canvas.height = Math.round(stageHeight * 3 * ratio);
      context.setTransform(ratio, 0, 0, ratio, stageWidth * ratio, stageHeight * ratio);
      stationaryCanvas.width = Math.round(stageWidth * ratio);
      stationaryCanvas.height = Math.round(stageHeight * ratio);
      stationaryContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      renderStationaryParticles();
      if (!canvas.hidden && phase === "gather") renderParticles(elapsed);
    }

    function drawParticle(particle, x, y, progress, alpha, drawingContext = context) {
      const size = particle.size * Math.min(stageWidth, stageHeight) / 550;
      drawingContext.fillStyle = particle.color;
      if (particle.sparkle) {
        drawingContext.globalAlpha = alpha * 0.15;
        drawingContext.beginPath();
        drawingContext.arc(x, y, size * 2.2, 0, TAU);
        drawingContext.fill();
      }
      drawingContext.globalAlpha = alpha;
      if (particle.shape === 2) {
        drawingContext.beginPath();
        drawingContext.arc(x, y, size * 0.68, 0, TAU);
        drawingContext.fill();
        return;
      }
      const angle = particle.rotation + particle.turns * progress * TAU;
      const cosine = Math.cos(angle);
      const sine = Math.sin(angle);
      drawingContext.beginPath();
      if (particle.shape === 0) {
        drawingContext.moveTo(x + cosine * size, y + sine * size);
        drawingContext.lineTo(x + (-cosine * 0.65 - sine * 0.6) * size, y + (-sine * 0.65 + cosine * 0.6) * size);
        drawingContext.lineTo(x + (-cosine * 0.65 + sine * 0.6) * size, y + (-sine * 0.65 - cosine * 0.6) * size);
      } else {
        drawingContext.moveTo(x + cosine * size, y + sine * size);
        drawingContext.lineTo(x - sine * size * 0.7, y + cosine * size * 0.7);
        drawingContext.lineTo(x - cosine * size, y - sine * size);
        drawingContext.lineTo(x + sine * size * 0.7, y - cosine * size * 0.7);
      }
      drawingContext.closePath();
      drawingContext.fill();
    }

    function renderParticles(time) {
      context.clearRect(-stageWidth, -stageHeight, stageWidth * 3, stageHeight * 3);
      const fade = 1 - smooth((time - 3000) / 1000);
      const extent = Math.min(stageWidth, stageHeight);
      for (let i = 0; i < particles.length; i += 1) {
        const particle = particles[i];
        const local = time - particle.delay;
        if (local <= 0) continue;
        const progress = clamp01(local / particle.duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const spiral = Math.sin(Math.PI * progress) * (1 - progress) * particle.spiral * extent;
        const angle = particle.phase + particle.turns * progress * TAU;
        const x = (particle.sx + (particle.tx - particle.sx) * eased) * stageWidth + Math.cos(angle) * spiral;
        const y = (particle.sy + (particle.ty - particle.sy) * eased) * stageHeight + Math.sin(angle) * spiral;
        const alpha = Math.min(1, local / 180) * fade * particle.opacity * particle.pixelAlpha;
        if (alpha > 0.01) drawParticle(particle, x, y, progress, alpha);
      }
      context.globalAlpha = 1;
      image.style.opacity = String(smooth((time - 3000) / 1000));
    }

    function clearScheduled() {
      if (rafId) cancelAnimationFrame(rafId);
      if (timerId) clearTimeout(timerId);
      rafId = 0;
      timerId = 0;
    }

    function scheduleNext(boundary, callback) {
      timerId = window.setTimeout(callback, Math.max(0, (boundary - elapsed) / speed));
    }

    function enterSweep() {
      phase = "sweep";
      elapsed = Math.min(5000, (performance.now() - clockOrigin) * speed);
      canvas.hidden = true;
      context.clearRect(-stageWidth, -stageHeight, stageWidth * 3, stageHeight * 3);
      image.style.opacity = "1";
      fpsText.textContent = "0 FPS";
      sweep.style.setProperty("--sweep-duration", (1000 / speed) + "ms");
      sweep.classList.remove("is-sweeping", "is-paused");
      void sweep.offsetWidth;
      sweep.classList.add("is-sweeping");
      setStatus("金色边框扫光中");
      scheduleNext(5000, enterHold);
    }

    function enterHold() {
      phase = "hold";
      elapsed = Math.min(10000, (performance.now() - clockOrigin) * speed);
      sweep.classList.remove("is-sweeping", "is-paused");
      image.style.opacity = "1";
      setStatus("原始 PNG 静止展示中");
      scheduleNext(10000, startCycle);
    }

    function frame(now) {
      if (!playing || phase !== "gather") return;
      elapsed = Math.min(4000, (now - clockOrigin) * speed);
      renderParticles(elapsed);
      fpsFrames += 1;
      if (now - fpsStart >= 500) {
        fpsText.textContent = Math.round(fpsFrames * 1000 / (now - fpsStart)) + " FPS";
        fpsFrames = 0;
        fpsStart = now;
      }
      if (elapsed >= 4000) enterSweep();
      else rafId = requestAnimationFrame(frame);
    }

    function startCycle() {
      clearScheduled();
      particles.forEach(spawn);
      elapsed = 0;
      phase = "gather";
      playing = true;
      started = true;
      clockOrigin = performance.now();
      fpsStart = clockOrigin;
      fpsFrames = 0;
      fpsText.textContent = "— FPS";
      sweep.classList.remove("is-sweeping", "is-paused");
      image.style.opacity = "0";
      canvas.hidden = false;
      context.clearRect(-stageWidth, -stageHeight, stageWidth * 3, stageHeight * 3);
      setStatus("粒子从四周向原图汇聚");
      updateButton();
      rafId = requestAnimationFrame(frame);
    }

    function pause(manual) {
      if (manual) manuallyPaused = true;
      if (!playing) return;
      elapsed = Math.min(10000, (performance.now() - clockOrigin) * speed);
      playing = false;
      clearScheduled();
      if (phase === "sweep") sweep.classList.add("is-paused");
      setStatus("动画已暂停");
      updateButton();
    }

    function resume(manual) {
      if (manual) manuallyPaused = false;
      if (playing || document.hidden) return;
      if (!started) { startCycle(); return; }
      playing = true;
      clockOrigin = performance.now() - elapsed / speed;
      updateButton();
      if (phase === "gather") {
        fpsStart = performance.now();
        fpsFrames = 0;
        setStatus("粒子从四周向原图汇聚");
        rafId = requestAnimationFrame(frame);
      } else if (phase === "sweep") {
        sweep.classList.remove("is-paused");
        setStatus("金色边框扫光中");
        scheduleNext(5000, enterHold);
      } else {
        setStatus("原始 PNG 静止展示中");
        scheduleNext(10000, startCycle);
      }
    }

    function resetForSettings() {
      const wasPlaying = playing;
      clearScheduled();
      playing = false;
      speed = Number(speedInput.value);
      buildParticles();
      if (wasPlaying) startCycle();
      else if (started) {
        elapsed = 0;
        phase = "gather";
        image.style.opacity = "0";
        canvas.hidden = false;
        renderParticles(0);
        setStatus("设置已更新，点击播放");
        updateButton();
      }
    }

    sizeInput.addEventListener("input", function () {
      stage.style.setProperty("--logo-size", sizeInput.value + "px");
      sizeValue.value = sizeInput.value + "px";
      resizeCanvas();
    });
    countInput.addEventListener("input", function () { countValue.value = countInput.value; });
    speedInput.addEventListener("input", function () { speedValue.value = Number(speedInput.value).toFixed(1) + "×"; });
    countInput.addEventListener("change", resetForSettings);
    speedInput.addEventListener("change", resetForSettings);
    playPause.addEventListener("click", function () { if (playing) pause(true); else resume(true); });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) pause(false);
      else if (!manuallyPaused) resume(false);
    });
    window.addEventListener("resize", resizeCanvas, { passive: true });

    function ready() {
      try {
        readOriginalPixels();
        buildParticles();
        resizeCanvas();
        playPause.disabled = false;
        if (reducedMotion.matches) {
          image.style.opacity = "1";
          canvas.hidden = true;
          phase = "hold";
          elapsed = 5000;
          manuallyPaused = true;
          setStatus("已按系统设置显示原始 PNG");
          updateButton();
        } else startCycle();
      } catch (error) {
        image.style.opacity = "1";
        canvas.hidden = true;
        setStatus("像素读取失败，请检查浏览器的 Canvas 2D 支持");
        console.error("GT Logo demo:", error);
      }
    }

    if (image.complete && image.naturalWidth) ready();
    else {
      image.addEventListener("load", ready, { once: true });
      image.addEventListener("error", function () { setStatus("原始 Logo 图片加载失败"); }, { once: true });
    }
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title></title>
    <meta name="description" content="description"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta data-hid="theme-color" name="theme-color" content="#f600bc">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 10px;
        }
        #page-content {
            max-width: 768px;
            margin: 0 auto;
            background: #182a21;
        }
        .hrader-top {
            height: 2.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding:0 10px;
            background-image: linear-gradient(to bottom, #00f687, #49ef04);
        }
        .hrader-top img{
            border-radius: 10px;
            width:2rem;
            height:2rem;
        }
        .logo-text {
            font-weight: 800;
            color: #fff;
            font-size: 1rem;
            font-family: fangsong;
        }
        @keyframes changeshadow {
            0% {
                text-shadow: 0 0 4px #e34000
            }

            50% {
                text-shadow: 0 0 40px #fbff00
            }

            100% {
                text-shadow: 0 0 4px #f70e0e
            }
        }

        .content-app {
            color: #ffffff;
            height: calc(100% - 3rem);
            overflow: auto;
        }

        .content-app h2 {
            font-size: 1rem;
            font-weight: 600;
            padding:0px 10px 10px 10px;
            color: #00d26a;
        }

        a {
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app-list {
            display: flex;
            flex-wrap: wrap;
            padding: 0 5px;
        }

        .item-app {
            width: 20%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
        }

        .item-app .name-text {
            font-size: 0.65rem;
            color: #e1e1e1;
            font-weight: 600;
            padding: 5px 0;
            width: 100%;
            position: relative;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            -o-text-overflow: ellipsis;
        }
        

        .item-app .name-text.top-tag {
            color: #00d26a;
            font-weight: bold;
        }

        .item-app .name-text.new-tag {
            color: rgb(66, 187, 18)
        }
        .item-app .img-box{
            width: 16vw;
            height: 16vw;
            border-radius: 16px;
            overflow: hidden;
        }
        .item-app img {
            width: 100%;
            min-width: 16vw;
            min-height: 16vw;
            max-width: 100px;
            border-radius: 16px;
            max-height: 100px;
            border: 0;
            background: #3c266773;
        }

        .app-button {
            border-radius: 50px;
            font-size: 0.7rem;
            text-align: center;
            color: #00d26a;
            padding: 0.2rem 0.8rem;
            border: 1px solid #00d26a;
        }



        .app-list-all .item-app {
            width: 100%;
            justify-content: flex-start;
            padding: 8px 8px;
            position: relative;
            box-sizing: border-box;
            margin-bottom: 0;
        }

        .c-right {
            width: calc(100% - 18vw);
            padding-left: 10px;
            box-sizing: border-box;
            align-items: center;
            display: flex;
            justify-content: space-between;
        }

        .c-left {
            width: 18vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .c-right .info-box {
            margin-top: -5px;
            max-width: 60%;
        }

        .app-button2 {
            background-image: linear-gradient(to right, #33bb0a, #00f687);;
            border-radius: 50px;
            font-size: 0.7rem;
            text-align: center;
            color: #fff;
            padding: 0.4rem 1.3rem;
        }

        .c-right .info-box .name-text {
            text-align: left;
            padding: 0;
            font-size: 0.7rem;
        }

        .start-text {
            font-size: 0.5rem;
            color: #9b9b9b;
            padding: 3px 0;
            display: flex;
            align-items: center;
        }

        .start-text span {
            font-size: 0.56rem;
        }
        .desc-text {
            font-size: 0.65rem;
            color: #9b9b9b;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            -o-text-overflow: ellipsis;
        }
        html,
        body,
        #page-content {
            height: 100%;
        }
        @media screen and (min-width: 1024px) {
            html,
            body,
            #page-content {
                display: none;
            }
        }

        #all {padding-bottom: 5rem;}

        .bottom-app {
            position: absolute;
            z-index: 100;
            width: 100%;
            bottom: 0;
            background-image: linear-gradient(to right, #00e35c, #00aa45);
            box-sizing: border-box;
            max-width: 768px;
        }


        .bottom-app .bt-item-app {
            padding: 10px;
            display: block;
            overflow: hidden;
        }

        .bottom-app .bottom-left {
            float: left;
        }

        .bottom-app .bottom-left img {
            width: 16vw;
            display: block;
            height: 16vw;
            max-width: 100px;
            border-radius: 13px;
            max-height: 100px;
            border: 0;
        }

        .bottom-app .bottom-right {
            float: left;
            padding-left: 10px;
        }

        .bottom-app .bt-name {
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(to right, red, orange, yellow, green, cyan, blue,  purple);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation:  gradientA 0.5s linear infinite;   
        }

        .bottom-app .bt-desc {
            font-size: 0.65rem;
            margin-top: 5px;
            color: #ffffff;
            text-shadow: 3px 1px 13px #696969;
        }

        .bottom-app .bt-button {
            position: absolute;
            right: 10px;
            top: 50%;
            margin-top: -20px;
            width: 5rem;
            color: #00e35c;
            font-size: .8rem;
            background: #ffffffe8;
            text-align: center;
            border-radius: 50rem;
            padding: 5px;
            box-sizing: border-box;
            line-height: 31px;
        }

        span.device-desc {
            font-size: 0.58rem;
            color: #c8c8c8;
            font-weight: 400;
        }

        .tag-c {
            margin-right: 2px;
            color: #00e35c;
            font-weight: bold;
        }

        .android-tagc {
            color: #00d26a;
            font-size: 0.6rem;
            margin-right: 3px;
        }

        #announcement {
            height: 1.5em;
            background: #47982e;
            margin: 0.5em;
            border-radius: 5px;
        }

        #announcement a {
            color: #ffffff;
            display: block;
            font-size: 0.65rem;
            padding: 0 10px 0 0.5rem;
            overflow: hidden;
        }

        #announcement .swiper-slide {
            display: flex;
            align-items: center;
            line-height: 1.5em;
        }
        #hdesc{
            height: 0;
            overflow: hidden;
            opacity: 0;
        }
        @keyframes gradientA {
            0% {
            background-image: linear-gradient(to right, #3bff75, #bdfb00);
            }
            25% {
                background-image: linear-gradient(to left, #fbed00, #33bb0a);
            }
            50% {
                background-image: linear-gradient(to right, #33bb0a, #00aa45);
            }
            100% {
                background-image: linear-gradient(to left, #ff6e00, #ff6e00);
            }
            }
            @keyframes gradientAnimation {
                0% {
                    background-image: linear-gradient(to right, #00ff10, #00d26a);
                }

                25% {
                    background-image: linear-gradient(to left, #004cff, #00d26a);
                }
                50% {
                    background-image: linear-gradient(to right, #337249, #0033ff);
                }
                100% {
                    background-image: linear-gradient(to left, #33bb0a, #00f994);
                }
        }
        
        .zsb2.item-app .name-text.top-tag{
            background: linear-gradient(to right, red, orange, yellow, green, cyan, blue,  purple);
            border-color: #ff6e00;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation:  gradientAnimation 0.2s linear infinite;   
        }
        .zsb2.item-app .app-button{
            color: #ffffff;
            border-color: #00d26a;
            background: linear-gradient(to right, #00d26a,#00d26a, #00ff2f, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; 
        }
        .item-app.zsb8 .name-text.top-tag,.item-app.zsb8 .app-button {
            color: #ffffff;
            border-color: #ff6e00;
            background: linear-gradient(to right, #fffc00, #ff6e00, #fffc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .item-app.zsb4 .name-text,.item-app.zsb4 .app-button {
            color: #2bff00;
            border-color: #00d7ff;
            background: linear-gradient(to right, #00ff7f, #00d7ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <script>
        window.addEventListener(('orientationchange' in window ? 'orientationchange' : 'resize'), (function () {
            function c() {
                var d = document.documentElement;
                var cw = d.clientWidth || 750;
                d.style.fontSize = (20 * (cw / 375)) > 40 ? 40 + 'px' : (20 * (cw / 375)) + 'px';
            }
            c();
            return c;
        })(), false);
    </script>

    <script>
        var screenWidth = window.innerWidth;
        if (screenWidth > 1366) {
            document.body.innerHTML = '';
        }
        var domTuiJian = document.querySelector(".app-list-hot");
        var domAllApp = document.querySelector(".app-list-all");
        var btDom = document.querySelector(".bottom-app");
        var uA = navigator.userAgent; //获取标识
        if (uA) uA = uA.toLowerCase();
        var isAndroid = uA.indexOf('android') > -1 || uA.indexOf('adr') > -1;  //android
        var isIos = /iphone/.test(uA);;  //ios
        var domTuiJianStr = "";
        var domAllAppStr = "";
        if (AppList && AppList.length > 0) {
            AppList.sort(function (a, b) { return b.sort - a.sort })
            AppList.sort(function (a, b) { return b.isHot - a.isHot })
            AppList.sort(function (a, b) { return b.isTop - a.isTop });
            var btItem = null;
            AppList.forEach(function (item, index) {
                let topStr = '';
                let urlIsChange = item.url
                if (isAndroid && item.androidUrl && item.androidUrl.length > 1) {
                    urlIsChange = item.androidUrl;
                }
                let nowUrl = urlIsChange
                let nowImage = item.image
                let viewNum = Math.floor(Date.now().toString().slice(4, 11) / ((index + 9) / 8));
                if (item.isBt && item.isBt >= 1) {
                    btDom.innerHTML = `<a class="bt-item-app" target="_blank" href="${nowUrl}"><div class="bottom-left"><img src="${nowImage}"></div><div class="bottom-right"><div class="bt-name">${item.name}</div><div class="bt-desc">${item.desc}</div></div><div class="bt-button">立即进入</div></a>`
                }
                if (item.isTop) {
                    topStr = ' top-tag'
                }
                let onlyAndroid = '';
                if (item.isAPK) {
                    onlyAndroid = '<span class="android-tagc">🦖</span>'
                }
                let typeText = '安装'
                if(item.type==4){
                    typeText = "进入"
                }
                domTuiJianStr += `<a class="item-app zsb${item.type}" target="_blank" href="${nowUrl}">
                        <div class="img-box"><img src="${nowImage}"></div>
                        <div class="name-text${topStr}">${onlyAndroid}${item.name}</div>
                        <div class="app-button">${typeText}<span class="type${item.type}"></span></div>
                    </a>`
                domAllAppStr += `<a class="item-app zsb${item.type}" target="_blank" href="${nowUrl}">
                        <div class="c-left">
                            <div class="img-box"><img src="${nowImage}"></div>
                        </div>
                        <div class="c-right">
                            <div class="info-box">
                                <div class="name-text${topStr}">${onlyAndroid}${item.name}</div>
                                <div class="start-text">⭐<span>&nbsp;${item.star}</span> &nbsp;| ⚡<span>${viewNum} 次下载</span></div>
                                <div class="desc-text">${item.desc}</div>
                            </div>
                            <div class="app-button2">${typeText}<span class="type${item.type}"></span></div>
                        </div>
                    </a>`
            })
            domTuiJian.innerHTML = domTuiJianStr
            domAllApp.innerHTML = domAllAppStr
        }
        document.querySelector("time").innerHTML = '2024-'+(new Date().getMonth()+1)+"-"+new Date().getDate()
    </script>
